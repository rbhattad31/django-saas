{% extends 'layouts/base.html' %}
{% load static %}

{% block title %} Add New User {% endblock title %}

{% block stylesheets %}
<style>
    .text-danger {
        color: #dc3545 !important; /* Bootstrap's red color */
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }
    label.error {
        color: #dc3545 !important; /* Bootstrap red */
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }
</style>
{% endblock stylesheets %}

{% block content %}
<div class="main-content pt-4">
    <div class="row">
        <div class="col-md-12" id="successmsg" style="display: none">
            <div class="alert alert-primary" id="alert-primary">
                <button class="close float-right" type="button" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
        </div>
        <div class="col-md-12">
            <div class="card mt-3 mb-3">
                <div class="card-header bg-transparent">
                    <h4 class="pb-2">Add New User
                        <span class="float-right">
                            <a class="btn btn-primary btn-rounded" href="{% url 'api-user-list' %}">Cancel</a>
                        </span>
                    </h4>
                </div>
                <div class="card-body m-1">
                    <form id="createUserForm" method="POST" action="{% url 'api-user-create' %}" novalidate="novalidate">
                        {% csrf_token %}
                        <input type="hidden" name="_token" value="{{ csrf_token }}">
                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label for="name">Full Name<span style="color: red">*</span></label>
                                <input type="text" id="name" name="name" class="form-control" placeholder="Enter Full Name" autocomplete="off">
                                <span class="text-danger" id="name_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="email">Email<span style="color: red">*</span></label>
                                <input type="email" id="email" name="email" class="form-control" placeholder="Enter Email" autocomplete="off">
                                <span class="text-danger" id="email_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="mobile_number">Mobile Number<span style="color: red">*</span></label>
                                <input type="text" id="mobile_number" name="mobile_number" class="form-control" placeholder="Enter Mobile Number" autocomplete="off">
                                <span class="text-danger" id="mobile_number_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="password">Password<span style="color: red">*</span></label>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" autocomplete="new-password">
                                <span class="text-danger" id="password_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="cppassword">Confirm Password<span style="color: red">*</span></label>
                                <input type="password" id="cppassword" name="confirmpassword" class="form-control" placeholder="Enter Confirm Password" autocomplete="new-password">
                                <span class="text-danger" id="confirmpassword_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="account">Account<span style="color: red">*</span></label>
                                <select name="account" class="form-control" id="account">
                                    <option value="" selected>Please Select</option>
                                    {% for acc in accounts %}
                                        <option value="{{ acc.id }}">{{ acc.account_name }}</option>
                                    {% endfor %}
                                </select>
                                <span class="text-danger" id="account_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="role">Role<span style="color: red">*</span></label>
                                <select name="role" class="form-control" id="role">
                                    <option value="" selected>Please Select</option>
                                    {% for role in roles %}
                                        <option value="{{ role.id }}">{{ role.name }}</option>
                                    {% endfor %}
                                </select>
                                <span class="text-danger" id="role_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="timezone">Timezone<span style="color: red">*</span></label>
                                <select name="timezone" class="form-control" id="timezone">
                                    <option value="" selected>Please Select</option>
                                    {% for tz in timezones %}
                                        <option value="{{ tz.value }}">{{ tz.text }}</option>
                                    {% endfor %}
                                </select>
                                <span class="text-danger" id="timezone_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="additional_info">Additional Information</label>
                                <textarea name="additional_info" class="form-control" id="additional_info" placeholder="Enter Additional Information" rows="4"></textarea>
                                <span class="text-danger" id="additional_info_error"></span>
                            </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-sm-12 d-flex justify-content-center">
                                <button type="submit" class="btn btn-primary btn-rounded m-1" id="submit">Submit</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- jQuery must load first -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<!-- jQuery Validate -->
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

<script>
var $main = jQuery;
window.$main = $main;

$main(document).ready(function () {
    // Custom validation methods
    $main.validator.addMethod("alphanum_special", function (value, element) {
        return this.optional(element) || /^[\w\s.,\-@()/]+$/.test(value);
    }, "Only letters, numbers, and certain special characters are allowed.");

    $main.validator.addMethod("numeric", function (value, element) {
        return this.optional(element) || /^[0-9]*$/.test(value);
    }, "Please enter a valid number.");

    $main.validator.addMethod("custom_email", function (value, element) {
        return this.optional(element) || /^[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$/.test(value);
    }, "Please enter a valid email address.");

    // Initialize form validation
    $main('#createUserForm').validate({
        ignore: "",
        rules: {
            name: { required: true, alphanum_special: true,minlength:3, maxlength: 255 },
            email: { required: true, custom_email: true, maxlength: 100 },
            mobile_number: { required: true, numeric: true, minlength: 10, maxlength: 10 },
            password: { required: true, minlength: 8, maxlength: 30 },
            confirmpassword: { required: true, equalTo: '#password', minlength: 8, maxlength: 30 },
            account: { required: true },
            role: { required: true },
            timezone: { required: true },
            additional_info: { alphanum_special: true, maxlength: 1000 }
        },
        messages: {
            name: { required: "Full Name is required." },
            email: { 
                required: "Email is required.",
                custom_email: "Enter a valid Email."
            },
            mobile_number: { 
                required: "Mobile Number is required.",
                numeric: "Enter a valid Mobile Number.",
                minlength: "Mobile Number must be exactly 10 digits.",
                maxlength: "Mobile Number must be exactly 10 digits."
            },
            password: { 
                required: "Password is required.",
                minlength: "Password must be at least 8 characters."
                //maxlength: "Password cannot exceed 30 characters."
            },
            confirmpassword: { 
                required: "Confirm Password is required.",
                equalTo: "Passwords do not match.",
                minlength: "Confirm Password must be at least 8 characters."
                //maxlength: "Password cannot exceed 30 characters."
            },
            account: { required: "Account is required." },
            role: { required: "Role is required." },
            timezone: { required: "Timezone is required." },
            additional_info: { alphanum_special: "Enter valid Additional Information." }
        },
        errorPlacement: function (error, element) {
            const name = element.attr("name");
            $main(`#${name}_error`).html(error);
        }
    });

    // Form submission via AJAX
    $main('#createUserForm').on('submit', function (e) {
        e.preventDefault();
        if ($main(this).valid()) {
            const formData = $main(this).serialize();
            $main.ajax({
                url: '{% url "api-user-create" %}',
                type: 'POST',
                data: formData,
                headers: {
                    'X-CSRF-TOKEN': $main('input[name="_token"]').val()
                },
                success: function (response) {
                    if (response.success) {
                        $main('#successmsg').show().find('#alert-primary').text(response.message);
                        setTimeout(() => {
                            window.location.href = '{% url "api-user-list" %}';
                        }, 2000);
                    } else {
                        let errors = response.message || { message: 'An error occurred while submitting the form.' };
                        let errorMessage = '';
                        if (typeof errors === 'object') {
                            $main.each(errors, function (field, messages) {
                                $main(`#${field}_error`).text(messages.join(', '));
                                errorMessage += `${field}: ${messages.join(', ')}\n`;
                            });
                        } else {
                            errorMessage = errors;
                        }
                        alert(errorMessage);
                    }
                },
                error: function (xhr) {
                    let errors = xhr.responseJSON || { message: 'An unexpected error occurred.' };
                    let errorMessage = '';
                    if (errors.message && typeof errors.message === 'object') {
                        $main.each(errors.message, function (field, messages) {
                            $main(`#${field}_error`).text(messages.join(', '));
                            errorMessage += `${field}: ${messages.join(', ')}\n`;
                        });
                    } else {
                        errorMessage = errors.message || 'An unexpected error occurred.';
                    }
                    alert(errorMessage);
                }
            });
        }
    });
});
</script>
{% endblock %}
