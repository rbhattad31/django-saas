{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
<div class="main-content pt-4">
    <div class="row">
    <div class="col-md-12">
        <div class="card o-hidden mb-4">
            <div class="card-header">
                <h3 class="w-50 float-left card-title m-0">Third Party Receipts</h3>
                                <a href="/third_party_receipts/create/" class="btn btn-primary btn-rounded m-1" style="float:right">Add Third Party Receipt</a>
                                
                
            </div>
            <div class= "card-body p-0">
                <form id="filterForm" class="m-0 border rounded p-3">
                <!-- Filter Toggle -->
                <div class="d-flex align-items-center mb-2">
                <strong class="me-2">Filters By:</strong>
                <a class="text-primary" data-bs-toggle="collapse" href="#filterCollapse" role="button" aria-expanded="false" aria-controls="filterCollapse">
                    <i class="bi bi-chevron-down"></i> click here
                </a>
                </div>

                <!-- Collapsible Filter Fields -->
                <div class="collapse" id="filterCollapse">
                <div class="row">
                    <!-- Left Column -->
                    <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Receipt Number</label>
                        <input type="text" class="form-control" id="deposit_number" name="receipt_number" placeholder="Receipt No" autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Payment Type</label>
                        <select class="form-select" name="payment_type">
                        <option value="">Please Select</option>
                        <option value="Cash">Cash</option>
                        <option value="Cheque">Cheque</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Receipt Date From</label>
                        <input type="text" class="form-control hasDatepicker" name="from" placeholder="Receipt Date From" autocomplete="off">
                    </div>
                    </div>

                    <!-- Right Column -->
                    <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Agent Name</label>
                        <input type="text" class="form-control" name="agent_name" placeholder="Agent Name" autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Deal Type</label>
                        <select class="form-select" name="deal_type">
                        <option value="">Please Select</option>
                        <option value="Rental">Rental</option>
                        <option value="Sales">Sales</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Receipt Date To</label>
                        <input type="text" class="form-control hasDatepicker" name="to" placeholder="Receipt Date To" autocomplete="off">
                    </div>
                    </div>
                </div>

                <!-- Filter Buttons -->
                <div class="row mt-2">
                    <div class="col-md-12 d-flex gap-3">
                    <button type="submit" class="btn btn-purple" style="background-color: #6f42c1; color: white;">Filter</button>
                    <button type="reset" class="btn btn-purple" style="background-color: #6f42c1; color: white;">Reset</button>
                    </div>
                </div>
                </div>
                </form>
                                                         
            </div>

        <table id="receiptlist_table" class="display " style="width:100%">
     
</table>
        </div>
    </div>

</div>



<!-- jQuery -->
<script src="/static/assets/vendor/jquery/dist/jquery.min.js"></script> 

<!-- Bootstrap -->
<script src="/static/assets/vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

<!-- DataTables Buttons JS -->

<!-- Dependencies for export -->

  <script>
    function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== "") {
    for (let cookie of document.cookie.split(";")) {
      cookie = cookie.trim();
      if (cookie.startsWith(name + "=")) {
        cookieValue = decodeURIComponent(cookie.slice(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
  



  $(document).ready(function () {
   const table =  $('#receiptlist_table').DataTable({
       scrollY: '400px',
    scrollX: true,
    scrollCollapse: true,
    fixedColumns: true,
    paging: true,
    processing: true,
    searching: true,
    language: {
    paginate: {
      previous: "Previous",
      next: "Next "
        }
    },

    pagingType: "simple_numbers",
    order: [[7, "desc"]], // Default order by "Submitted Date" descending
    serverSide: true,
        rowId: 'id',  // 💡 Use 'id' field from each row for DT_RowId

        ajax: {
            url: '/third_party_receipts/api/deposits/filter/',
            type: "POST",
            processData: false,
            contentType: "application/json",
            headers: {
                "X-CSRFToken": getCookie("csrftoken"),
            },
            data: function (d) {
                // Include any filters or custom values you want to send
                d.deposit_number = $('#deposit_number').val();
                d.agent_name = $('[name="agent_name"]').val();
                d.from = $('[name="from"]').val();
                d.to = $('[name="to"]').val();
                d.payment_type = $('[name="payment_type"]').val();
                d.deal_type = $('[name="deal_type"]').val();
                return JSON.stringify(d); // ✅ Return JSON
            },
            dataSrc: function (json) {
                console.log("Data received from server:", json);
                return json.data;
            },
        },
        dom:  "<'row mt-1'l<'col-md-6 d-flex align-items-start pl-0'B><'col-md-6 text-end'f>>" +
  "<'row mt-1'<'col-sm-12'tr>>" +
  "<'row mt-1'<'col-md-6'i><'col-md-6 text-end'p>>",
       buttons: [
            {
                extend: 'excelHtml5',
                text: ' Excel',
                titleAttr: 'Excel',
                orientation: 'landscape',
                pageSize: 'A4',
            },
            {
                extend: 'pdfHtml5',
                text: ' PDF',
                columns: [2,3,4,5,6,7,8,9,10],
                titleAttr: 'PDF',
                orientation: 'landscape',
                pageSize: 'A4',
            },
            
             
        ],
         success: function (data) {

            console.log("Data received from server:", data); // Debugging line
         },

        columns: [
               
            {data :"action",title:"Action"},
            { data: 'id', visible: false }, // Hidden ID column for row identification  
            { data: 'deposit_number', title: 'Receipt Number' },
            { data: 'date', title: ' Receipt Date' },
            { data: 'dhs', title: ' Dhs' },
            { data: 'fils', title: ' Fils' },
            { data: 'payment_type', title: ' Payment Type' },
            { data: 'sec_date', title: ' Payment Date' },
            { data: 'deal_type', title: ' Deal Type' },
            { data: 'agent_name', title: ' Agent Name' },
            { data: 'project_name', title: ' Project Name' },
            { data: 'building_name', title: ' Building Name' },
            { data: 'unit_number', title: ' Unit Number' }
        ],
    });

    $("#filterForm").on("submit", function (e) {
    e.preventDefault(); // Prevent page reload
    table.ajax.reload(); // Reload DataTable with new filters
  });
    $('#filter').click(function(){
       table.ajax.reload();
    });
    $('#reset').click(function(){
    $('#payment_type,#deal_type').prop('selectedIndex',0);
    $("#from,#to,#deposit_number,#agent_name,#deal_type,#unit_number,#building_name").val('');
    table.ajax.reload();
    });
});


    // Handle edit/delete actions (optional implementation hooks)

    downloadRow = function (receiptId) {
        // Redirect to the download URL
        window.location.href = `/third_party_receipts/recipts/download/${receiptId}/`;

    };
  
 
  
  </script>

  <style>
  table.dataTable tbody td {
    font-size: 15px;
    font-family: 'Segoe UI', sans-serif;
  }
</style>

{% endblock %}
