{% extends 'layouts/base.html' %}
{% block title %} Management Receipt Details {% endblock title %}

{% block extra_styles %}
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.6.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons (if needed) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
{% endblock extra_styles %}

{% block content %}
<div class="main-content pt-4">
    <div class="col-md-12" id="successmsg" style="display: none">
        <div class="alert alert-primary" id="alert-primary">
            <button class="close float-right" type="button" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
            <span id="alert-message"></span>
        </div>
    </div>
    <div class="col-md-12">
        <h4 class="pb-2">Management Receipt Details
            <span class="float-right mr-2">
                <a class="btn btn-primary btn-rounded" href="{% url 'management_receipts_manager' %}">Back</a>
            </span>
        </h4>
        <div class="card mb-5">
            <div class="card-body">
                <form id="createReceiptForm">
                    <input type="hidden" name="_token" value="{{ csrf_token }}">
                    <div class="row">
                        <div class="col-md-6 form-group mb-3">
                            <label for="date">Receipt Date</label>
                            <input type="text" id="date" name="date" class="form-control" value="{{ receipt.date|date:'d-m-Y'|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="received_from">Received From</label>
                            <input type="text" name="received_from" class="form-control" id="received_from" placeholder="Enter Received From" value="{{ receipt.received_from|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="receipt_number">Receipt Number</label>
                            <input type="text" name="receipt_number" class="form-control" id="receipt_number" placeholder="Enter Receipt Number" value="{{ receipt.receipt_number|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="dhs">Dhs</label>
                            <input type="text" name="dhs" class="form-control" id="dhs" value="{{ receipt.dhs|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="fils">Fils</label>
                            <input type="text" name="fils" class="form-control" id="fils" value="{{ receipt.fils|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="sum_of_dhs">The Sum Of Dhs</label>
                            <input type="text" name="sum_of_dhs" class="form-control" id="sum_of_dhs" value="{{ receipt.sum_of_dhs|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="payment_type">Payment Type</label>
                            <input type="text" name="payment_type" class="form-control" id="payment_type" value="{{ receipt.payment_type|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="cheque_no">Cheque No</label>
                            <input type="text" name="cheque_no" class="form-control" id="cheque_no" value="{{ receipt.cheque_no|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="bank">Bank Name</label>
                            <input type="text" name="bank" class="form-control" id="bank" value="{{ receipt.bank|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="sec_date">Payment Date</label>
                            <input type="text" name="sec_date" class="form-control" id="sec_date" value="{{ receipt.sec_date|date:'d-m-Y'|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="being">Being</label>
                            <input type="text" name="being" class="form-control" id="being" value="{{ receipt.being|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="status">Status</label>
                            <input type="text" name="status" class="form-control" id="status" value="{{ receipt.status|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="deal_type">Type</label>
                            <input type="text" name="deal_type" class="form-control" id="deal_type" value="{{ receipt.deal_type|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="agent_name">Agent Name</label>
                            <input type="text" name="agent_name" class="form-control" id="agent_name" value="{{ receipt.agent_name|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="project_name">Project Name</label>
                            <input type="text" name="project_name" class="form-control" id="project_name" value="{{ receipt.project_name|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="building_name">Building Name</label>
                            <input type="text" name="building_name" class="form-control" id="building_name" value="{{ receipt.building_name|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label for="unit_number">Unit Number</label>
                            <input type="text" name="unit_number" class="form-control" id="unit_number" value="{{ receipt.unit_number|default_if_none:'' }}" readonly style="background-color: #f8f9fa">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}

{% block extra_scripts %}
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script>
        $(document).ready(function() {
            // Ensure readonly inputs are styled consistently
            $('.form-control[readonly]').css({
                'background-color': '#f8f9fa',
                'cursor': 'not-allowed'
            });

            // Handle alert dismissal
            $('.close').on('click', function() {
                $('#successmsg').hide();
            });

            // Optional: Show a sample alert on page load (e.g., for confirmation)
            function showAlert(message, type = 'primary') {
                $('#alert-message').text(message);
                $('#alert-primary').removeClass('alert-primary alert-success alert-danger')
                    .addClass(`alert-${type}`);
                $('#successmsg').show();
                // Auto-hide alert after 5 seconds
                setTimeout(function() {
                    $('#successmsg').fadeOut();
                }, 5000);
            }

            // Example: Show alert if a query parameter indicates success (e.g., after edit)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success')) {
                showAlert('Receipt details loaded successfully', 'success');
            }

            // Handle Back button (optional, since it's a simple link)
            $('.btn-rounded').on('click', function(e) {
                // No JS needed for simple navigation, but included for completeness
                console.log('Navigating back to receipt list');
            });
        });
    </script>
{% endblock extra_scripts %}
