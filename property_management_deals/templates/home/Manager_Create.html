{% extends 'layouts/base.html' %}
{% block title %} Create Management Receipt {% endblock title %}
 
{% block stylesheets %}
<style>
    .text-danger {
        color: #dc3545 !important; /* Bootstrap's red color for .text-danger, with !important to override conflicts */
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }
    label.error {
        color: #dc3545 !important; /* Bootstrap red */
        font-size: 0.875rem;
        margin-top: 0.25rem;
    }
</style>
{% endblock stylesheets %}
 
{% block content %}
<div class="main-content pt-4">
    <div class="row">
        <div class="col-md-12" id="successmsg" style="display: none">
            <div class="alert alert-primary" id="alert-primary">
                <button class="close float-right" type="button" data-dismiss="alert" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
        </div>
        <div class="col-md-12">
            <div class="card mt-3 mb-3">
                <div class="card-header bg-transparent">
                    <h4 class="pb-2">Add New Management Receipt
                        <span class="float-right">
                            <a class="btn btn-primary btn-rounded" href="{% url 'management_receipts_manager' %}">Cancel</a>
                        </span>
                    </h4>
                </div>
                <div class="card-body m-1">
                    <form id="createReceiptForm" method="POST" action="{% url 'management_receipts_create' %}" novalidate="novalidate">
                        {% csrf_token %}
                        <input type="hidden" name="_token" value="{{ csrf_token }}">
                        <div class="row">
                            <div class="col-md-6 form-group mb-3">
                                <label for="date">Receipt Date<span style="color: red">*</span></label>
                                <input type="text" id="date" name="date" class="form-control datepicker-input" placeholder="Enter Receipt Date" autocomplete="off">
                                <span class="text-danger" id="date_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="receipt_number">Receipt Number<span style="color: red">*</span></label>
                                <input type="text" name="receipt_number" class="form-control" id="receipt_number" placeholder="Enter Receipt Number" readonly value="{{ next_receipt_number }}">
                                <span class="text-danger" id="receipt_number_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="received_from">Received From<span style="color: red">*</span></label>
                                <input type="text" id="received_from" name="received_from" class="form-control" placeholder="Enter Received From">
                                <span class="text-danger" id="received_from_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="dhs">Dhs<span style="color: red">*</span></label>
                                <input type="text" name="dhs" class="form-control" id="dhs" placeholder="Enter Dhs">
                                <span class="text-danger" id="dhs_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="fils">Fils<span style="color: red">*</span></label>
                                <input type="text" name="fils" class="form-control" id="fils" placeholder="Enter Fils">
                                <span class="text-danger" id="fils_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="sum_of_dhs">The Sum Of Dhs<span style="color: red">*</span></label>
                                <input type="text" name="sum_of_dhs" class="form-control" id="sum_of_dhs" placeholder="Enter Sum Of Dhs">
                                <span class="text-danger" id="sum_of_dhs_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="payment_type">Payment Type<span style="color: red">*</span></label>
                                <select name="payment_type" class="form-control" id="payment_type">
                                    <option value="" selected>Please Select</option>
                                    <option value="Cash">Cash</option>
                                    <option value="Cheque">Cheque</option>
                                    <option value="Bank Transfer">Bank Transfer</option>
                                </select>
                                <span class="text-danger" id="payment_type_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="cheque_no">Cheque No<span class="cheque_no" style="color: red"></span></label>
                                <input type="text" name="cheque_no" class="form-control" id="cheque_no" placeholder="Enter Cheque No">
                                <span class="text-danger" id="cheque_no_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="bank">Bank Name<span class="bank_name" style="color: red"></span></label>
                                <input type="text" name="bank" class="form-control" id="bank" placeholder="Enter Bank Name">
                                <span class="text-danger" id="bank_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="sec_date">Payment Date<span style="color: red">*</span></label>
                                <input type="text" id="sec_date" name="sec_date" class="form-control datepicker-input" placeholder="Enter Payment Date" autocomplete="off">
                                <span class="text-danger" id="sec_date_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="being">Being<span style="color: red">*</span></label>
                                <input type="text" name="being" class="form-control" id="being" placeholder="Enter Being">
                                <span class="text-danger" id="being_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="status">Status</label>
                                <input type="text" name="status" class="form-control" id="status" value="Unused" placeholder="Status" readonly>
                                <span class="text-danger" id="status_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="deal_type">Type<span style="color: red">*</span></label>
                                <select name="deal_type" class="form-control" id="deal_type">
                                    <option value="" selected>Please Select</option>
                                    <option value="Management Fee">Management Fee</option>
                                    <option value="Ejari Fee">Ejari Fee</option>
                                </select>
                                <span class="text-danger" id="deal_type_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="agent_name">Agent Name<span style="color: red">*</span></label>
                                <input type="text" name="agent_name" class="form-control" id="agent_name" placeholder="Enter Agent Name">
                                <span class="text-danger" id="agent_name_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="project_name">Project Name<span style="color: red">*</span></label>
                                <input type="text" name="project_name" class="form-control" id="project_name" placeholder="Enter Project Name">
                                <span class="text-danger" id="project_name_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="building_name">Building Name<span style="color: red">*</span></label>
                                <input type="text" name="building_name" class="form-control" id="building_name" placeholder="Enter Building Name">
                                <span class="text-danger" id="building_name_error"></span>
                            </div>
                            <div class="col-md-6 form-group mb-3">
                                <label for="unit_number">Unit Number<span style="color: red">*</span></label>
                                <input type="text" name="unit_number" class="form-control" id="unit_number" placeholder="Enter Unit Number">
                                <span class="text-danger" id="unit_number_error"></span>
                            </div>
                        </div>
                        <div class="form-group row">
                            <div class="col-sm-12 d-flex justify-content-center">
                                <button type="submit" class="btn btn-primary btn-rounded m-1" id="submit">Submit</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
 
<!-- jQuery must load first -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- jQuery UI for Datepicker -->
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
<link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
<!-- Bootstrap JS -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<!-- jQuery Validate -->
<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
 
<script>
var $main = jQuery;
window.$main = $main;
 
$main(document).ready(function () {
 
 
    let today = new Date();
    let dd = String(today.getDate()).padStart(2, '0');
    let mm = String(today.getMonth() + 1).padStart(2, '0'); // January is 0
    let yyyy = today.getFullYear();
    let todayFormatted = dd + '-' + mm + '-' + yyyy;  // dd-mm-yyyy format
 
    $main('#date').val(todayFormatted);
    $main('#sec_date').val(todayFormatted);
    // Initialize datepickers
    //$main('.datepicker-input').datepicker({
    //    dateFormat: 'dd-mm-yy',
    //    changeMonth: true,
    //    changeYear: true,
    //    maxDate: 0
    //}).focus(function() {
    //    $main(this).datepicker("show");
    //});
    // Receipt Date: only up to today
    $main('#date').datepicker({
        dateFormat: 'dd-mm-yy',
        changeMonth: true,
        changeYear: true,
        maxDate: 0
    }).focus(function() {
        $main(this).datepicker("show");
    });
 
    // Payment Date: allow future dates
    $main('#sec_date').datepicker({
        dateFormat: 'dd-mm-yy',
        changeMonth: true,
        changeYear: true
    }).focus(function() {
        $main(this).datepicker("show");
    });
 
   
    // Optional: reformat existing yyyy-mm-dd values to dd-mm-yy
    $main('.datepicker-input').each(function() {
        let val = $main(this).val();
        if (val && /^\d{4}-\d{2}-\d{2}$/.test(val)) {
            const parts = val.split('-');
            $main(this).val(parts[2] + '-' + parts[1] + '-' + parts[0]);
        }
    });
 
    // Universal date formatter
    function formatForBackend(dateString) {
        if (!dateString) return '';
        dateString = dateString.trim();
        console.log("Raw input date:", dateString);
 
        let ymdMatch = dateString.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
        if (ymdMatch) {
            let yyyy = ymdMatch[1];
            let mm = ymdMatch[2].padStart(2, '0');
            let dd = ymdMatch[3].padStart(2, '0');
            console.log("Detected YYYY-MM-DD, returning:", `${yyyy}-${mm}-${dd}`);
            return `${yyyy}-${mm}-${dd}`;
        }
 
        let dmyMatch = dateString.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
        if (dmyMatch) {
            let dd = dmyMatch[1].padStart(2, '0');
            let mm = dmyMatch[2].padStart(2, '0');
            let yyyy = dmyMatch[3];
            console.log("Converted D-M-YYYY to YYYY-MM-DD:", `${yyyy}-${mm}-${dd}`);
            return `${yyyy}-${mm}-${dd}`;
        }
 
        let dmy2Match = dateString.match(/^(\d{1,2})-(\d{1,2})-(\d{2})$/);
        if (dmy2Match) {
            let dd = dmy2Match[1].padStart(2, '0');
            let mm = dmy2Match[2].padStart(2, '0');
            let yyyy = '20' + dmy2Match[3];
            console.log("Converted D-M-YY to YYYY-MM-DD:", `${yyyy}-${mm}-${dd}`);
            return `${yyyy}-${mm}-${dd}`;
        }
 
        console.warn("Invalid date format detected:", dateString);
        return '';
    }
 
    $main.validator.addMethod("validDate", function(value, element) {
        if (!value) return false;
        let formats = [
            /^\d{4}-\d{1,2}-\d{1,2}$/,
            /^\d{1,2}-\d{1,2}-\d{4}$/,
            /^\d{1,2}-\d{1,2}-\d{2}$/
        ];
        for (let i = 0; i < formats.length; i++) {
            if (formats[i].test(value)) return true;
        }
        return false;
    }, "Please enter a valid date.");
 
    $main.validator.addMethod("alphanum_special", function (value, element) {
        return this.optional(element) || /^[\w\s.,\-@()/]+$/.test(value);
    }, "Only letters, numbers, and certain special characters are allowed.");
 
    $main.validator.addMethod("numeric", function (value, element) {
        return this.optional(element) || /^[0-9]*$/.test(value);
    }, "Please enter a valid number.");
 
    // Initialize form validation
    $main('#createReceiptForm').validate({
        ignore: "",
        rules: {
            date: { required: true, validDate: true },
            receipt_number: { required: true, alphanum_special: true, maxlength: 20 },
            received_from: { required: true, alphanum_special: true, maxlength: 255 },
            dhs: { required: true, numeric: true, maxlength: 10 },
            fils: { required: true, numeric: true, maxlength: 10 },
            sum_of_dhs: { required: true, alphanum_special: true, maxlength: 255 },
            payment_type: { required: true },
            cheque_no: {
                required: function(element) {
                    return $main('#payment_type').val() === 'Cheque';
                },
                alphanum_special: true,
                minlength: 3,
                maxlength: 15
            },
            bank: {
                required: function(element) {
                    return $main('#payment_type').val() === 'Cheque' || $main('#payment_type').val() === 'Bank Transfer';
                },
                alphanum_special: true,
                maxlength: 255
            },
            sec_date: { required: true, validDate: true },
            being: { required: true, alphanum_special: true, maxlength: 255 },
            status: { required: true, alphanum_special: true, maxlength: 50 },
            deal_type: { required: true },
            agent_name: { required: true, alphanum_special: true, maxlength: 255 },
            project_name: { required: true, alphanum_special: true, maxlength: 255 },
            building_name: { required: true, alphanum_special: true, maxlength: 255 },
            unit_number: { required: true, alphanum_special: true, maxlength: 15 }
        },
        messages: {
            date: { required: "Receipt Date is required." },
            receipt_number: { required: "Receipt Number is required." },
            received_from: { required: "Received From is required." },
            dhs: { required: "Dhs is required." },
            fils: { required: "Fils is required." },
            sum_of_dhs: { required: "The Sum Of Dhs is required." },
            payment_type: { required: "Payment Type is required." },
            cheque_no: { required: "Cheque No is required when payment type is Cheque." },
            bank: { required: "Bank Name is required when payment type is Cheque or Bank Transfer." },
            sec_date: { required: "Payment Date is required." },
            being: { required: "Being is required." },
            status: { required: "Status is required." },
            deal_type: { required: "Type is required." },
            agent_name: { required: "Agent Name is required." },
            project_name: { required: "Project Name is required." },
            building_name: { required: "Building Name is required." },
            unit_number: { required: "Unit Number is required." }
        },
        errorPlacement: function (error, element) {
            const name = element.attr("name");
            $main(`#${name}_error`).html(error);
        }
    });
 
    // Toggle validation rules for cheque_no and bank based on payment_type
    $main('#payment_type').on('change', function () {
        const paymentType = $main(this).val();
        // Clear previous error messages
        $main('#cheque_no_error').text('');
        $main('#bank_error').text('');
        // Update asterisk visibility
        $main('.cheque_no').text(paymentType === 'Cheque' ? '*' : '');
        $main('.bank_name').text(paymentType === 'Cheque' || paymentType === 'Bank Transfer' ? '*' : '');
 
        if (paymentType === 'Cheque') {
            $main('#cheque_no').rules('add', { required: true, minlength: 3, maxlength: 15 });
            $main('#bank').rules('add', { required: true });
        } else if (paymentType === 'Bank Transfer') {
            $main('#cheque_no').rules('remove', 'required minlength maxlength');
            $main('#bank').rules('add', { required: true });
        } else {
            $main('#cheque_no').rules('remove', 'required minlength maxlength');
            $main('#bank').rules('remove', 'required');
        }
    });
 
    // Form submission via AJAX
    $main('#createReceiptForm').on('submit', function (e) {
        e.preventDefault();
        if ($main(this).valid()) {
            console.log("Raw Receipt Date input:", $main('#date').val());
            console.log("Raw Payment Date input:", $main('#sec_date').val());
 
            let convertedDate = formatForBackend($main('#date').val());
            let convertedSecDate = formatForBackend($main('#sec_date').val());
 
            console.log("Converted Receipt Date:", convertedDate);
            console.log("Converted Payment Date:", convertedSecDate);
 
            $main('#date').val(convertedDate);
            $main('#sec_date').val(convertedSecDate);
 
            const formData = $main(this).serialize();
            $main.ajax({
                url: '{% url "management_receipts_create" %}',
                type: 'POST',
                data: formData,
                headers: {
                    'X-CSRF-TOKEN': $main('input[name="_token"]').val()
                },
                success: function (response) {
                    if (response.success) {
                        $("html, body").animate(
                        {
                            scrollTop: $(".main-header").offset().top,
                        },
                        1000
                        );
                        $main('#successmsg').show().find('#alert-primary').text(response.message);
                        setTimeout(() => {
                            window.location.href = '{% url "management_receipts_manager" %}';
                        }, 2000);
                    } else {
                        alert(response.message || 'An error occurred while submitting the form.');
                    }
                },
                error: function (xhr) {
                    let errors = xhr.responseJSON || { message: 'An unexpected error occurred.' };
                    let errorMessage = '';
                    if (errors.errors) {
                        $main.each(errors.errors, function (field, messages) {
                            $main(`#${field}_error`).text(messages.join(', '));
                            errorMessage += `${field}: ${messages.join(', ')}\n`;
                        });
                    } else {
                        errorMessage = errors.message;
                    }
                    alert(errorMessage);
                }
            });
        }
    });
});
</script>
{% endblock %}
