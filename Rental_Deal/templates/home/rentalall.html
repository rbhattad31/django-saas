{% extends 'layouts/base.html' %}

{% block title %}  All Rental Deals {% endblock title %}

{% block content %}

<div class="">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>All Rental Deals</h3>
    <button class="btn btn-primary"> Create Rental  Deal</button>

  </div>

 

<!-- Bootstrap CSS -->
<div>
<form id="filterForm" class="m-0 border rounded p-3 bg-light ">
  <!-- Filter Toggle -->
  <div class="d-flex align-items-center mb-2">
    <strong class="me-2">Filters By:</strong>
    <a class="text-primary" data-bs-toggle="collapse" href="#filterCollapse" role="button" aria-expanded="false" aria-controls="filterCollapse">
      <i class="bi bi-chevron-down"></i> click here
    </a>
  </div>

  <!-- Collapsible Filter Fields -->
  <div class="collapse" id="filterCollapse">
    <div class="row">
      <!-- Left Column -->
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Reference No</label>
          <input type="text" class="form-control" name="reference_number" placeholder="Reference No">
        </div>
       <input type="hidden" name="type" value="">

        <div class="mb-3">
          <label class="form-label">Building Name</label>
          <input type="text" class="form-control" name="building_name" placeholder="Building Name">
        </div>
        <div class="mb-3">
          <label class="form-label">Owner Name</label>
          <input type="text" class="form-control" name="owner_name" placeholder="Owner Name">
        </div>
        <div class="mb-3">
          <label class="form-label">Owner Mobile</label>
          <input type="text" class="form-control" name="owner_mobile" placeholder="Owner Mobile">
        </div>
        <div class="mb-3">
          <label class="form-label">New Deal / Renewal</label>
          <select class="form-select" name="deal_type">
            <option value="">Select Deal</option>
            <option value="New">New</option>
            <option value="Renewal">Renewal</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Deal Date From</label>
          <input type="date" class="form-control" name="from_date">
        </div>
      </div>

      <!-- Right Column -->
      <div class="col-md-6">
        <div class="mb-3">
          <label class="form-label">Unit No</label>
          <input type="text" class="form-control" name="unit_details" placeholder="Unit No">
        </div>
        <div class="mb-3">
          <label class="form-label">Project Name</label>
          <input type="text" class="form-control" name="project_name" placeholder="Project Name">
        </div>
        <div class="mb-3">
          <label class="form-label">Tenant Name</label>
          <input type="text" class="form-control" name="tenant_name" placeholder="Tenant Name">
        </div>
        <div class="mb-3">
          <label class="form-label">Tenant Mobile</label>
          <input type="text" class="form-control" name="tenant_mobile" placeholder="Tenant Mobile">
        </div>
        <div class="mb-3">
          <label class="form-label">Deal Status</label>
          <select class="form-select" name="deal_status">
            <option value="">Please Select</option>
            <option value="Active">Active</option>
            <option value="Closed">Closed</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Deal Date To</label>
          <input type="date" class="form-control" name="to_date">
        </div>
      </div>
    </div>

    <!-- Filter Buttons -->
    <div class="row mt-2">
      <div class="col-md-12 d-flex gap-3">
        <button type="submit" class="btn btn-purple" style="background-color: #6f42c1; color: white;">Filter</button>
        <button type="reset" class="btn btn-purple" style="background-color: #6f42c1; color: white;">Reset</button>
      </div>
    </div>
  </div>

  <!-- Visually OUTSIDE collapse but INSIDE form -->
  <div class="row mt-3">
    <div class="col-md-12 d-flex align-items-center">
      <label class="me-2">Show</label>
      <select name="length" class="form-select w-auto">
        <option value="10" selected>10</option>
        <option value="25">25</option>
        <option value="50">50</option>
      </select>
      <label class="ms-2">entries</label>
    </div>
  </div>
</form>
</div>
<table id="myTable" class="display">
    <thead>
        <tr>
      {% comment %} <th>ID</th>
      <th>Reference #</th>
      <th>Agent</th>
      <th>Tenant</th>
      <th>Owner</th>
      <th>Rental Price</th>
      <th>Building</th>
      <th>Project</th>   {% endcomment %}
        </tr>
    </thead>
    <tbody>
        
    </tbody>
</table>





</div>

 

 


{% endblock %}
