    function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      for (let cookie of document.cookie.split(";")) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + "=")) {
          cookieValue = decodeURIComponent(cookie.slice(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

      $.validator.addMethod(
  "alphanum_special",
  function (value, element) {
    const cleaned = value.trim();
    return this.optional(element) || /^[a-zA-Z0-9 _.,\-\/()]*$/.test(cleaned);
  },
  "Only alphanumeric and basic special characters allowed."
);

$.validator.addMethod(
  "phoneNumber",
  function (value, element) {
    var exp = /^[\+]?\d*$/im;
    //console.log(exp.test(value));
    return exp.test(value);
  },
  "Phone number must only contain numbers and +"
);

$.validator.addMethod(
  "numeric",
  function (value, element) {
    return this.optional(element) || /^[0-9]+$/.test(value);
  },
  "Please enter a valid number."
);

$.validator.addMethod(
  "only_text",
  function (value, element) {
    return this.optional(element) || /^[a-zA-Z\s]+$/.test(value.trim());
  },
  "Only letters and spaces are allowed."
);
// validations for the form
$.validator.addMethod(
  "custom_email",
  function (value, element) {
    // Accepts empty values or valid email format
    return (
      this.optional(element) ||
      /^[\w\.\-]+@([\w\-]+\.)+[a-zA-Z]{2,7}$/.test(value.trim())
    );
  },
  "Please enter a valid email address."
);

<script>
  $(document).ready(function () {
    $("#date").datepicker({
      dateFormat: "dd-mm-yy",
      autoclosed: true,
      changeMonth: true,
      changeYear: true,
      maxDate: 0,
      yearRange: "-50:+50",
    });
    $("#sec_date").datepicker({
      dateFormat: "dd-mm-yy",
      autoclosed: true,
      changeMonth: true,
      changeYear: true,
      yearRange: "-50:+50",
    });
    var payment_type = $("#payment_type").val();
    if (payment_type == "") {
      $(".bank_name").hide();
      $(".cheque_no").hide();
    } else if (payment_type == "Cash") {
      $(".bank_name").hide();
      $(".cheque_no").hide();
    } else if (payment_type == "Cheque") {
      $(".bank_name").show();
      $(".cheque_no").show();
    } else if (payment_type == "Bank Transfer") {
      $(".bank_name").show();
      $(".cheque_no").hide();
    }

    $("#payment_type").on("change", function () {
      var payment_type = this.value;
      if (payment_type == "Cheque") {
        $(".bank_name").show();
        $(".cheque_no").show();
      } else if (payment_type == "Cash") {
        $(".bank_name").hide();
        $(".cheque_no").hide();
      } else if (payment_type == "Bank Transfer") {
        $(".cheque_no").hide();
        $(".bank_name").show();
      }
    });
    $("#submit").click(function () {
      var payment_type = $("#payment_type").val();
      if (payment_type == "Cash") {
        $("#cheque_no_error").hide();
        $("#bank_error").hide();
      } else if (payment_type == "Cheque") {
        $("#cheque_no_error").show();
        $("#bank_error").show();
      } else if (payment_type == "Bank Transfer") {
        $("#cheque_no_error").hide();
        $("#bank_error").show();
      }
    });
  });
