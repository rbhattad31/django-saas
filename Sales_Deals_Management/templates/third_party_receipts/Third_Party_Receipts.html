{% block content %}
<div class="main-content pt-4"><div class="row">
    <div class="col-md-12">
                <div class="card o-hidden mb-4">
            <div class="card-header">
                <h3 class="w-50 float-left card-title m-0">Third Party Receipts</h3>
                                <a href="http://deals create" class="btn btn-primary btn-rounded m-1" style="float:right">Add Third Party Receipt</a>
                                
                
            </div>
            <div>
            <form id="filterForm" class="m-0 border rounded p-3 bg-light">
                <!-- Filter Toggle -->
                <div class="d-flex align-items-center mb-2">
                <strong class="me-2">Filters By:</strong>
                <a class="text-primary" data-bs-toggle="collapse" href="#filterCollapse" role="button" aria-expanded="false" aria-controls="filterCollapse">
                    <i class="bi bi-chevron-down"></i> click here

                </div>

                    <div class="mb-3">

                    </div>
                    <div class="mb-3">
                        <label class="form-label">Payment Type</label>
                        <select class="form-select" name="payment_type">
                        <option value="">Please Select</option>
                        <option value="Cash">Cash</option>
                        <option value="Cheque">Cheque</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Receipt Date From</label>
                        <input type="text" class="form-control hasDatepicker" name="from" placeholder="Receipt Date From" autocomplete="off">
                    </div>
                    </div>

                    <!-- Right Column -->
                    <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Agent Name</label>
                        <input type="text" class="form-control" name="agent_name" placeholder="Agent Name" autocomplete="off">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Deal Type</label>
                        <select class="form-select" name="deal_type">
                        <option value="">Please Select</option>
                        <option value="Rental">Rental</option>
                        <option value="Sales">Sales</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Receipt Date To</label>
                        <input type="text" class="form-control hasDatepicker" name="to" placeholder="Receipt Date To" autocomplete="off">
                    </div>
                    </div>
                </div>

                <!-- Filter Buttons -->
                <div class="row mt-2">
                    <div class="col-md-12 d-flex gap-3">
                    <button type="submit" class="btn btn-purple" style="background-color: #6f42c1; color: white;">Filter</button>
                    <button type="reset" class="btn btn-purple" style="background-color: #6f42c1; color: white;">Reset</button>
                    </div>
                </div>
                </div>
            </form>
                                                         
        </div>
    </div>
</div>

  <script>
    function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== "") {
    for (let cookie of document.cookie.split(";")) {
      cookie = cookie.trim();
      if (cookie.startsWith(name + "=")) {
        cookieValue = decodeURIComponent(cookie.slice(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

  $(document).ready(function () {
    $('#receiptlist_table').DataTable({
       scrollY: '400px',
    scrollX: true,
    scrollCollapse: true,
    fixedColumns: true,
    paging: true,
    processing: true,
    searching: true,
    order: [[7, "desc"]], // Default order by "Submitted Date" descending
    serverSide: true,
        rowId: 'id',  // 💡 Use 'id' field from each row for DT_RowId

        ajax: {
            url: '/third_party_receipts/api/deposits/filter/',
            type: "POST",
            processData: false,
            contentType: "application/json",
            headers: {
                "X-CSRFToken": getCookie("csrftoken"),
            },
            data: function (d) {
                // Include any filters or custom values you want to send
                d.deposit_number = $('#deposit_number').val();
                d.agent_name = $('[name="agent_name"]').val();
                d.from = $('[name="from"]').val();
                d.to = $('[name="to"]').val();
                d.payment_type = $('[name="payment_type"]').val();
                d.deal_type = $('[name="deal_type"]').val();
                return JSON.stringify(d); // ✅ Return JSON
            },
            dataSrc: 'data'  // Default unless your API responds differently
        },

        columns: [
              {
                data: null,
              title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Action</strong>',
                orderable: false,
                searchable: false,
                render: function (data, type, row) {
                    return `
                        <a href="/third_party_receipts/third-party/update/${row.id}/" title="Edit" class="text-warning mx-1" style="font-size: 16px;">
                            <i class="fas fa-edit"></i>
                        </a>

                        <a href="/third_party_receipts/third-party/view/${row.id}/" title="View" class="text-primary mx-1" style="font-size: 16px;">
                            <i class="fas fa-eye"></i>
                        </a>

                        <a href=" " onclick="downloadRow(${row.id})" title="Download" class="text-success mx-1" style="font-size: 16px;">
                            <i class="fas fa-download"></i>
                        </a>

                    `;
                }
            } ,
            { data: 'id', visible: false }, // Hidden ID column for row identification  
            { data: 'deposit_number', title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Receipt Number</strong>' },
            { data: 'date', title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Receipt Date</strong>' },
            { data: 'dhs', title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Dhs</strong>' },
            { data: 'fils', title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Fils</strong>' },
            { data: 'payment_type', title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Payment Type</strong>' },
            { data: 'sec_date', title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Payment Date</strong>' },
            { data: 'deal_type', title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Deal Type</strong>' },
            { data: 'agent_name', title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Agent Name</strong>' },
            { data: 'project_name', title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Project Name</strong>' },
            { data: 'building_name', title: '<strong style="font-family:Segoe UI, sans-serif; font-weight:600; font-size:16px;text-transform:none;">Building Name</strong>' },

});
