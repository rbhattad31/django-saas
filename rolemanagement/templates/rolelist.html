<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      for (let cookie of document.cookie.split(";")) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + "=")) {
          cookieValue = decodeURIComponent(cookie.slice(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }





$(document).ready(function () {
    var table = $('#grouplist_table').DataTable({
        processing: true,
        serverSide: true,   // 🚀 let DataTables send draw/start/length
        ajax: {
            url: "/role/filter/",
            type: "POST",
            contentType: "application/json",   // ✅ tell Django it's JSON
            headers: {
                "X-CSRFToken": getCookie("csrftoken"),
            },
            data: function (d) {
                // Add your custom filters along with DataTables params
                d.role = $("#filterbyRole").val();
                d.status = $("#role_status").val();

                console.log("➡️ Sending Data:", JSON.stringify(d, null, 2));
                return JSON.stringify(d);  // ✅ send JSON
            },
            dataSrc: function (json) {
                console.log("⬅️ Received Data:", json);
                return json.data || json;  // ✅ supports both {data:[]} and []
            },
             error: function (err) {
        if (err.status === 400) {
          const data = err.responseJSON;
          let messages = "";

          $.each(data, function (field, errors) {
            const msg = Array.isArray(errors) ? errors[0] : errors;
            messages += `${field}: ${msg}\n`;

            $.each(data.data, function (index, value) {
              messages +=
                index.charAt(0).toUpperCase() +
                index.slice(1) +
                " : " +
                value +
                "\n";
            });

            swal("Please fill mandatory field", messages);

            // Show field-wise error messages
            $.each(data.data, function (key, val) {
              $("#" + key + "_error")
                .text(val[0])
                .show();

              $(document).on("keyup", "input[name='" + key + "']", function () {
                $("#" + key + "_error").hide();
              });

              $(document).on(
                "change",
                "select[name='" + key + "']",
                function () {
                  $("#" + key + "_error").hide();
                }
              );
            });
          });
        } 
        else if (err.status === 403){
           
      
                // Option 1: redirect to your custom 403 page
                window.location.href = "/forbidden_page/";


        }
        
        
        else {
          const alertmsg = data.message || "Something went wrong!";
          swal("Error", alertmsg, "error");
        }
        // alert("Update failed.");
        console.error(err);
      },
            

        },
        dom:  "<'row mt-1'l<'col-md-6 d-flex align-items-start pl-0'B><'col-md-6 text-end'f>>" +
  "<'row mt-1'<'col-sm-12'tr>>" +
  "<'row mt-1'<'col-md-6'i><'col-md-6 text-end'p>>",
       buttons: [

                text: ' Excel',

                },

                },

            },
            
             
        ],
