<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      for (let cookie of document.cookie.split(";")) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + "=")) {
          cookieValue = decodeURIComponent(cookie.slice(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }





$(document).ready(function () {
    $('#grouplist_table').DataTable({
        processing: true,
        serverSide: true,   // 🚀 let DataTables send draw/start/length
        ajax: {
            url: "/role/filter/",
            type: "POST",
            contentType: "application/json",   // ✅ tell Django it's JSON
            headers: {
                "X-CSRFToken": getCookie("csrftoken"),
            },
            data: function (d) {
                // Add your custom filters along with DataTables params
                d.role = $("#filterbyRole").val();
                d.status = $("#role_status").val();

                console.log("➡️ Sending Data:", JSON.stringify(d, null, 2));
                return JSON.stringify(d);  // ✅ send JSON
            },
            dataSrc: function (json) {
                console.log("⬅️ Received Data:", json);
                return json.data || json;  // ✅ supports both {data:[]} and []
            }
        },
        columns: [
            { data: "action", title: "Action" },
            { data: "name", title: "Name" },
            { data: "is_active", title: "Status" },
            
        ]
    });
});
